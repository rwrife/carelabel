name: TestFlight Release

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

jobs:
  testflight:
    if: contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
      APP_BUNDLE_ID: com.infinityball.carelabel
      APP_NAME: CareLabel
      SCHEME: CareLabel
      PROJECT: CareLabel.xcodeproj
      EXPORT_DIR: ${{ github.workspace }}/build/release-export
      ARCHIVE_PATH: ${{ github.workspace }}/build/CareLabel.xcarchive
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert release secrets present
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 ASC_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done

      - name: Select exact Xcode pin
        run: |
          set -euo pipefail
          DEVELOPER_DIR=$(python3 Scripts/select_xcode.py --toolchain toolchain.json)
          export DEVELOPER_DIR
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Materialize ASC key file
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Archive app
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$ARCHIVE_PATH")"
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION=0.1.0 \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            2>&1 | python3 Scripts/redact_secrets.py

      - name: Assert archived app is iPhone-only
        run: |
          set -euo pipefail
          APP_PLIST="$ARCHIVE_PATH/Products/Applications/$APP_NAME.app/Info.plist"
          test -f "$APP_PLIST"
          plutil -convert json -o "$RUNNER_TEMP/app-info.json" "$APP_PLIST"
          python3 - "$RUNNER_TEMP/app-info.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding='utf-8') as handle:
              info = json.load(handle)
          family = info.get('UIDeviceFamily')
          if family != [1]:
              raise SystemExit(f'Expected UIDeviceFamily [1], observed {family!r}')
          print('Verified archived UIDeviceFamily == [1]')
          PY

      - name: Write ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>uploadMethod</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>teamID</key><string>${ASC_TEAM_ID}</string>
          </dict>
          </plist>
          PLIST

      - name: Export and upload to TestFlight
        run: |
          set -euo pipefail
          mkdir -p "$EXPORT_DIR"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | python3 Scripts/redact_secrets.py

      - name: Poll App Store Connect processing state
        run: |
          set -euo pipefail
          python3 Scripts/poll_asc_build.py

      - name: Upload release artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: testflight-release-${{ github.sha }}
          path: |
            build
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup ASC key file
        if: always()
        run: |
          rm -f "$KEY_PATH"
          echo "Removed temporary ASC key file"
